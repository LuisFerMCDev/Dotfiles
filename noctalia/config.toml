# Noctalia Glass — config curada (capa base)
# Esta capa vive en ~/.config/noctalia/ . Los cambios de la GUI van a
# ~/.local/state/noctalia/settings.toml y tienen prioridad.
# Para ver el resultado efectivo: noctalia config export | head

[theme]
mode = "dark"
shell_mode = "dark"
source = "community"
builtin = "Noctalia"
community_palette = "Oxocarbon"
wallpaper_scheme = "vibrant"
# Glass necesita translucidez: pure black la mata
pure_black_dark = false

  [theme.templates]
  builtin_ids = ["gtk3", "gtk4", "kitty", "hyprland"]

# Barra flotante translúcida estilo glass
[bar.default]
position = "top"
center = ["weather", "clock"]
thickness = 36
background_opacity = 0.72
radius = 12
margin_ends = 12
margin_edge = 8
padding = 14
widget_spacing = 6
capsule = true
capsule_opacity = 0.82
shadow = true
border_width = 1.0

[bar]
order = ["default"]

# Paneles en modo glass
[shell.panel]
transparency_mode = "glass"
borders = true
shadow = true

[shell]
settings_window_translucent = true
corner_radius_scale = 1.0

  [shell.shadow]
  alpha = 0.45
  direction = "down"

  [shell.animation]
  enabled = true
  speed = 1.0

# Wallpaper: usa tu carpeta actual + transiciones suaves
[wallpaper]
enabled = true
fill_mode = "crop"
directory = "/home/luisfernando/Imágenes/Wallpapers"
transition = ["fade", "wipe", "zoom"]
transition_duration = 1500
transition_on_startup = false

  [wallpaper.automation]
  enabled = false
  interval_seconds = 1800
  order = "random"

# OSD translúcido a juego
[osd]
background_opacity = 0.88
border = true
scale = 1.0

# Reloj central: solo hora (fecha en tooltip) + clima al lado
[widget.clock]
format = "{:%H:%M}"
tooltip_format = "{:%A, %d %B %Y}"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"
show_progress = false
max_length = 220
min_length = 80

[widget.audio-vis]
type = "audio_visualizer"
width = 64
bands = 20
show_when_idle = false
color_1 = "primary"
color_2 = "secondary"

[widget.sysmon-cpu]
type = "sysmon"
stat = "cpu_usage"
visualization = "gauge"
show_value = true

[weather]
enabled = true
refresh_minutes = 30
unit = "metric"

[widget.weather]
show_temperature = true
show_condition = false
max_length = 160
