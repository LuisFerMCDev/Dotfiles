general {
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = /home/luisfernando/Imágenes/Wallpapers/your-name-shooting-3840x2160-14938.jpg
    blur_passes = 2
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

image {
    monitor =
    path = /home/luisfernando/.config/hypr/avatar.png
    size = 150
    rounding = -1
    border_size = 4
    border_color = rgb(33ccff)
    rotate = 0
    reload_time = -1
    reload_cmd =
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 1.0)
    font_size = 64
    font_family = Sans
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%d/%m/%Y')"
    color = rgba(255, 255, 255, 0.9)
    font_size = 20
    font_family = Sans
    position = 0, -20
    halign = center
    valign = center
}

# Aviso de mayúsculas (capslock_color nativo roto, bug #660): lee el estado vía hyprctl
label {
    monitor =
    text = cmd[update:1000] hyprctl devices 2>/dev/null | grep -q "capsLock: yes" && echo "<b><span foreground='##33ccff' letter_spacing='2000'>Bloq Mayús</span></b>" || echo ""
    color = rgba(51, 204, 255, 1.0)
    font_size = 18
    font_family = Sans
    position = 0, -70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = rgb(24, 24, 24)
    inner_color = rgb(40, 40, 40)
    font_color = rgb(255, 255, 255)
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = Contraseña
    hide_input = false
    rounding = -1
    check_color = rgb(0, 255, 136)
    fail_color = rgb(255, 80, 80)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = rgba(255, 193, 7, 1.0)
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -120
    halign = center
    valign = center
}
