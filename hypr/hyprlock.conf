general {
    hide_cursor = true
    grace = 3
    no_fade_in = false
    fade_on_empty = true
}

background {
    monitor =
    path = /home/luisfernando/Imágenes/Wallpapers/your-name-shooting-3840x2160-14938.jpg
    color = rgba(30, 30, 46, 0.55)
    blur_passes = 2
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

image {
    monitor =
    path = /home/luisfernando/.config/hypr/avatar.png
    size = 170
    rounding = -1
    border_size = 4
    border_color = rgb(89b4fa)
    rotate = 0
    reload_time = -1
    reload_cmd =
    position = 0, 220
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 1.0)
    font_size = 92
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 40
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.55)
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A · %d %B %Y' | sed 's/.*/\L&/; s/^./\U&/')"
    color = rgba(205, 214, 244, 0.85)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, -30
    halign = center
    valign = center
}

# Aviso de mayúsculas (capslock_color nativo roto, bug #660): lee el estado vía hyprctl
label {
    monitor =
    text = cmd[update:1000] hyprctl devices 2>/dev/null | grep -q "capsLock: yes" && echo "<b><span foreground='#89b4fa' letter_spacing='2000'>Bloq Mayús</span></b>" || echo ""
    color = rgba(137, 180, 250, 1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -72
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 58
    outline_thickness = 2
    outer_color = rgb(137, 180, 250)
    inner_color = rgb(30, 30, 46)
    font_color = rgb(205, 214, 244)
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = Contraseña…
    hide_input = false
    rounding = 14
    check_color = rgb(166, 227, 161)
    fail_color = rgb(243, 139, 168)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = rgba(255, 193, 7, 1.0)
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -130
    halign = center
    valign = center
}
