general {
    lock_cmd = pidof hyprlock || /home/luisfernando/.local/bin/lock-screen
    before_sleep_cmd = pidof hyprlock || /home/luisfernando/.local/bin/lock-screen
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = pidof hyprlock || /home/luisfernando/.local/bin/lock-screen
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
