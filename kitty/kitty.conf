# Kitty · Fedora + Hyprland · oscuro transparente
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.0

# Transparencia (el blur lo pone Hyprland)
background_opacity 0.75
dynamic_background_opacity yes

# Espaciado y cursor
window_padding_width 14
cursor_shape block
cursor_blink_interval 0.5
cursor_trail 3
cursor_trail_decay 0.5 0.2
scrollback_lines 5000
enable_audio_bell no
confirm_os_window_close 0
tab_bar_min_tabs 1

# Control remoto (para scripts y extensiones de tema)
allow_remote_control socket-only
listen_on unix:/tmp/kitty

# Decoración: GNOME la necesita, Hyprland la quita por windowrule
hide_window_decorations no
window_border_width 1
wayland_titlebar_color background

# Tema oscuro (fallback Catppuccin Mocha; lo pisa themes/noctalia.conf generado por Noctalia)
foreground #cdd6f4
background #1e1e2e
selection_foreground #cdd6f4
selection_background #585b70
url_color #89b4fa
cursor #f5e0dc
cursor_text_color #1e1e2e

color0  #45475a
color1  #f38ba8
color2  #00ff99
color3  #f9e2af
color4  #33ccff
color5  #cba6f7
color6  #94e2d5
color7  #bac2de
color8  #585b70
color9  #f38ba8
color10 #00ff99
color11 #f9e2af
color12 #33ccff
color13 #cba6f7
color14 #94e2d5
color15 #a6adc8

# Pestañas minimalistas
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground #0b0e14
active_tab_background #00ff99
inactive_tab_foreground #bac2de
inactive_tab_background #1e1e2e
include themes/noctalia.conf
