# Kitty · Fedora + Hyprland · oscuro transparente
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.0

# Transparencia (el blur lo pone Hyprland)
background_opacity 0.82
dynamic_background_opacity yes

# Espaciado y cursor
window_padding_width 12
cursor_shape block
cursor_blink_interval 0.5
scrollback_lines 5000
enable_audio_bell no
confirm_os_window_close 0

# Decoración en Hyprland (bordes redondeados del compositor)
hide_window_decorations yes
window_border_width 0

# Tema oscuro (base Tokyo Night / Mocha)
foreground #cdd6f4
background #0b0e14
selection_foreground #0b0e14
selection_background #33ccff
url_color #00ff99
cursor #cdd6f4
cursor_text_color #0b0e14

color0  #45475a
color1  #f38ba8
color2  #00ff99
color3  #f9e2af
color4  #33ccff
color5  #cba6f7
color6  #94e2d5
color7  #bac2de
color8  #585b70
color9  #f38ba8
color10 #00ff99
color11 #f9e2af
color12 #33ccff
color13 #cba6f7
color14 #94e2d5
color15 #a6adc8

# Pestañas minimalistas
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground #0b0e14
active_tab_background #00ff99
inactive_tab_foreground #bac2de
inactive_tab_background #1e1e2e
include themes/noctalia.conf
